name: Patch telemetria
on:
  push:
    branches: [chatgpt/limpeza-telemetria-v2]
    paths:
      - scripts/patch_telemetria.py
      - .github/workflows/patch-telemetria.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/patch_telemetria.py
      - run: rm scripts/patch_telemetria.py .github/workflows/patch-telemetria.yml
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/gemini.ts src/lib/ficha.ts src/lib/telemetria-ia.ts scripts/patch_telemetria.py .github/workflows/patch-telemetria.yml
          git commit -m 'feat: ligar telemetria real de IA' || exit 0
          git push
