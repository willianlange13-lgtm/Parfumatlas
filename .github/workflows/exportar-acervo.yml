# Exporta a tabela "acervo" do Supabase (nome, casa, notas, acordes, fixação, projeção)
# e grava em acervo.json no ramo "dados-acervo". Não mexe na main nem no site.
# Precisa dos segredos do repositório: SUPABASE_URL e SUPABASE_SERVICE_ROLE_KEY
# (GitHub > Settings > Secrets and variables > Actions > New repository secret).
name: Exportar acervo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/exportar-acervo.yml"]

permissions:
  contents: write

jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - name: Ler acervo no Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Faltam os segredos SUPABASE_URL e SUPABASE_SERVICE_ROLE_KEY no GitHub."; exit 1
          fi
          python3 - <<'PY'
          import json, os, urllib.request
          url = os.environ["SUPABASE_URL"].rstrip("/") + "/rest/v1/acervo?select=*&order=casa.asc,nome.asc"
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          todos, passo, ini = [], 1000, 0
          while True:
              req = urllib.request.Request(url, headers={
                  "apikey": key, "Authorization": f"Bearer {key}",
                  "Range-Unit": "items", "Range": f"{ini}-{ini + passo - 1}"})
              lote = json.load(urllib.request.urlopen(req))
              todos += lote
              if len(lote) < passo: break
              ini += passo
          os.makedirs("saida", exist_ok=True)
          json.dump(todos, open("saida/acervo.json", "w"), ensure_ascii=False, indent=1)
          print(f"{len(todos)} perfumes exportados")
          PY

      - name: Gravar no ramo dados-acervo
        run: |
          cd saida
          git init -q -b dados-acervo
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add acervo.json
          git commit -q -m "Exportação do acervo $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dados-acervo
