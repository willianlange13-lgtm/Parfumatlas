name: Patch tipagem votos

on:
  push:
    branches:
      - chatgpt/corrige-votos-repetidos

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/corrige-votos-repetidos
          fetch-depth: 0
      - name: Aplicar ajuste
        run: python scripts/patch-votos-tipagem.py
      - name: Commitar e limpar temporários
        run: |
          rm scripts/patch-votos-tipagem.py .github/workflows/patch-votos-tipagem.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/ficha.ts scripts/patch-votos-tipagem.py .github/workflows/patch-votos-tipagem.yml
          git commit -m "fix: ajustar validação e tipagem dos votos"
          git push origin HEAD:chatgpt/corrige-votos-repetidos
