name: Patch revisão votos
on:
  push:
    branches: [chatgpt/corrige-votos-repetidos]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/corrige-votos-repetidos
          fetch-depth: 0
      - run: python scripts/patch_votos_review.py
      - run: |
          rm scripts/patch_votos_review.py .github/workflows/patch-votos-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/ficha.ts scripts/patch_votos_review.py .github/workflows/patch-votos-review.yml
          git commit -m "fix: restringir duplicidade a votos Fragrantica reais"
          git push origin HEAD:chatgpt/corrige-votos-repetidos
