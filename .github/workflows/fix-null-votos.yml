name: Fix null votos
on:
  push:
    branches: [chatgpt/corrige-votos-repetidos]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/corrige-votos-repetidos
      - run: python scripts/fix-null-votos.py
      - run: |
          rm scripts/fix-null-votos.py .github/workflows/fix-null-votos.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/ficha.ts scripts/fix-null-votos.py .github/workflows/fix-null-votos.yml
          git commit -m "fix: aceitar null na validação de votos"
          git push origin HEAD:chatgpt/corrige-votos-repetidos
