name: Patch votos repetidos

on:
  push:
    branches:
      - chatgpt/corrige-votos-repetidos

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/corrige-votos-repetidos
          fetch-depth: 0
      - name: Aplicar correção
        run: python scripts/patch-votos.py
      - name: Commitar correção e limpar arquivos temporários
        run: |
          rm scripts/patch-votos.py .github/workflows/patch-votos.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/ficha.ts scripts/patch-votos.py .github/workflows/patch-votos.yml
          git commit -m "fix: impedir votos copiados de exemplos"
          git push origin HEAD:chatgpt/corrige-votos-repetidos
