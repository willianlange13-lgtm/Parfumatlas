name: Fix telemetry timer
on:
  push:
    branches: [chatgpt/limpeza-telemetria-v2]
    paths:
      - scripts/fix_telemetry_timer.py
      - .github/workflows/fix-telemetry-timer.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/fix_telemetry_timer.py
      - run: rm scripts/fix_telemetry_timer.py .github/workflows/fix-telemetry-timer.yml
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/gemini.ts scripts/fix_telemetry_timer.py .github/workflows/fix-telemetry-timer.yml
          git commit -m 'fix: iniciar timer da telemetria OpenAI' || exit 0
          git push
